name: Build static blog pages & deploy

on:
  push:
    branches: [main]
  schedule:
    # 관리자가 새 글을 등록한 뒤에도 자동 반영되도록 매시간 재생성
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # posts/, index.html, sitemap.xml, css/tailwind-build.css 변경분을 커밋
      - name: Commit generated static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ index.html sitemap.xml css/tailwind-build.css
          git diff --cached --quiet || git commit -m "chore: regenerate static blog pages [skip ci]"
          git push
