name: Build static blog pages & deploy

on:
  push:
    branches: [main]
  schedule:
    # 관리자가 새 글을 등록한 뒤에도 자동 반영되도록 매시간 재생성
    - cron: "0 * * * *"
  workflow_dispatch: {}

# 자동(cron) 실행과 수동(workflow_dispatch) 실행이 겹치면 서로 push를 밀어내는
# 충돌(fetch first 에러)이 날 수 있어, 같은 브랜치에 대해 한 번에 하나만 돌게 큐잉한다.
concurrency:
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # posts/, index.html, sitemap.xml, rss.xml, css/tailwind-build.css 변경분을 커밋
      # concurrency로 겹침은 막았지만, 그 사이 다른 방식으로 main에 직접 커밋이
      # 들어왔을 가능성까지 대비해 push 실패 시 rebase 후 재시도한다.
      - name: Commit generated static pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ index.html sitemap.xml rss.xml css/tailwind-build.css
          git diff --cached --quiet || git commit -m "chore: regenerate static blog pages [skip ci]"

          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 실패, 원격 변경사항을 받아 재시도합니다 ($i/5)..."
            git fetch origin main
            git rebase origin/main
            sleep $((i * 5))
          done

          echo "여러 번 재시도했지만 push에 실패했습니다."
          exit 1
